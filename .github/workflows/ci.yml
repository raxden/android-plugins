name: CI

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: >
    -Dorg.gradle.jvmargs=-Xmx4g
    -Dkotlin.daemon.jvm.options=-Xmx2g

jobs:
  build:
    name: Build, test and validate plugins
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # TestKit fixtures compile Android projects (compileSdk 34); ubuntu-latest
      # ships the SDK and exposes it through ANDROID_HOME.
      - name: Build, run tests and validate plugins
        run: ./gradlew build validatePlugins --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: build/reports/tests
          if-no-files-found: ignore
          retention-days: 7
